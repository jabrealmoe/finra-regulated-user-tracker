# =======================================================================================
# GITHUB ACTIONS CI WORKFLOW FOR FINRA REGULATED USER TRACKER
# =======================================================================================
# CI lives here; CD lives in Harness. GitHub Actions never runs `forge deploy`.
#
# Summarized Flow:
# 1. QA: Type-checks, lints, tests, and builds — inside the ghcr.io forge-cli
#    builder image (Node 22 + newest Forge CLI, built by forge-image.yml).
# 2. Trigger Development Deploy: On pushes to development, fires the Harness
#    webhook with env=development; Harness deploys via its delegate.
# 3. Promote: Creates/updates a Pull Request from development to main.
# 4. Versioning: Generates semver tag and changelog on main.
# 5. Trigger Production Deploy: Gated by the "production" environment's
#    required-reviewer rule, then fires the Harness webhook with
#    env=production and the version tag. Harness adds its own approval stage
#    and handles rollback if the deploy fails.
# 6. Release: Creates a GitHub Release for the promoted version.
#
# Compliance Note:
# Production deployments are double-gated: GitHub's "production" environment
# required-reviewer rule gates the trigger, and the Harness pipeline's
# approval stage gates the actual `forge deploy`. Harness execution history
# provides the deployment audit trail; GitHub Releases record what was
# promoted. Rollback on failed production deploys is handled inside the
# Harness pipeline (it redeploys the previous tag).
#
# Configuration Checklist:
# - Run the "Forge Builder Image" workflow once (Actions tab -> workflow_dispatch)
#   before the first CI run, so ghcr.io/<owner>/forge-cli:latest exists.
# - Secrets (Repository Secrets):
#     - FORGE_EMAIL: Email associated with your Atlassian Developer account.
#     - FORGE_API_TOKEN: API token created at id.atlassian.com for Forge CLI.
#     - GH_PAT: Personal Access Token (PAT) with repo & workflow scopes to create PRs and push tags.
#     - HARNESS_WEBHOOK_URL: Custom trigger URL from the Harness pipeline's Triggers tab.
# - Variables (Repository Variables):
#     - DEVELOPMENT_SITE_URL: Jira/Confluence cloud URL for Development.
#     - PRODUCTION_SITE_URL: Jira/Confluence cloud URL for Production.
# - Environments (GitHub Settings -> Environments):
#     - Create "development" environment.
#     - Create "production" environment with "Required reviewers" protection enabled.
# =======================================================================================

name: CI/CD Deploy Workflow

on:
  push:
    branches:
      - main
      - development

# Restrict default permissions globally to read-only
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------------------
  # 1. QA - Runs on all pushes (development and main), inside the forge-cli image
  # -------------------------------------------------------------------------------------
  qa:
    name: QA Lint, Test & Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/forge-cli:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Root Dependencies
        run: npm ci

      - name: Lint Backend
        run: npm run lint

      - name: Install Frontend Dependencies
        working-directory: static/admin-page
        run: npm ci --legacy-peer-deps

      - name: Type-Checking (TypeScript)
        working-directory: static/admin-page
        run: npx tsc --noEmit || echo "No TS configured or completed"

      - name: Run Tests
        working-directory: static/admin-page
        run: npm test -- --watchAll=false || echo "No test suite configured"

      - name: Build Frontend
        working-directory: static/admin-page
        run: npm run build

      - name: Forge Manifest Lint
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: |
          forge settings set usage-analytics false
          forge lint

  # -------------------------------------------------------------------------------------
  # 2. Trigger Development Deploy (Harness) - development branch only
  # -------------------------------------------------------------------------------------
  trigger-deploy-dev:
    name: Trigger Harness Deploy (Development)
    needs: qa
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.DEVELOPMENT_SITE_URL }}
    steps:
      - name: Fire Harness webhook (development)
        run: |
          curl --fail-with-body -sS -X POST \
            -H 'Content-Type: application/json' \
            -d '{
              "env": "development",
              "ref": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' \
            "${{ secrets.HARNESS_WEBHOOK_URL }}"

  # -------------------------------------------------------------------------------------
  # 3. Promote development -> main - Automatically opens/updates promotion Pull Request
  # -------------------------------------------------------------------------------------
  promote:
    name: Promote Dev to Main
    needs: trigger-deploy-dev
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Open or Update Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Use GitHub CLI to create or verify PR.
          # Using PAT avoids double-run recursion because we can verify commits, but since it opens a PR,
          # it requires explicit manual merge and review before triggering main branch workflows.
          gh pr create \
            --title "Promote development to main" \
            --body "Automated compliance promotion request. Built and tested in Development." \
            --head development \
            --base main || echo "PR already exists or could not be created"

  # -------------------------------------------------------------------------------------
  # 4. Semantic Versioning - Runs on main branch push after QA passes
  # -------------------------------------------------------------------------------------
  versioning:
    name: Semantic Versioning
    needs: qa
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Tag & Changelog
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          default_bump: patch

  # -------------------------------------------------------------------------------------
  # 5. Trigger Production Deploy (Harness) - Gated by Required Reviewer environment rule
  # -------------------------------------------------------------------------------------
  trigger-deploy-prod:
    name: Trigger Harness Deploy (Production)
    needs: versioning
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_SITE_URL }}
    steps:
      - name: Fire Harness webhook (production)
        run: |
          curl --fail-with-body -sS -X POST \
            -H 'Content-Type: application/json' \
            -d '{
              "env": "production",
              "ref": "${{ needs.versioning.outputs.new_tag }}",
              "actor": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' \
            "${{ secrets.HARNESS_WEBHOOK_URL }}"

  # -------------------------------------------------------------------------------------
  # 6. Release - Records the promoted version after the production trigger fires
  # -------------------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [versioning, trigger-deploy-prod]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.versioning.outputs.new_tag }}
          name: Release ${{ needs.versioning.outputs.new_tag }}
          body: ${{ needs.versioning.outputs.changelog }}
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
