# =======================================================================================
# MANIFEST EGRESS COMPLIANCE SCAN
# =======================================================================================
# Calls the reusable manifest scanner (jabrealmoe/ReusableWorkflow) in deny
# mode against this app's Forge manifest: any string under the manifest's
# `external` key (permissions.external.fetch.*) referencing the
# jabreal.app.n8n.cloud endpoint is a security violation and fails the build.
#
# Compliance Note:
# This gate documents that outbound data flow is change-controlled, supporting
# the app's SEC Rule 17a-4 tamper-evidence posture.
# =======================================================================================

name: Manifest Egress Compliance

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  egress-denylist:
    uses: jabrealmoe/ReusableWorkflow/.github/workflows/atlassian-manifest-scan.yml@main
    with:
      manifest-path: manifest.yml
      rule-keys: external
      pattern: jabreal.app.n8n.cloud
      mode: deny
      fail-on-violation: true
