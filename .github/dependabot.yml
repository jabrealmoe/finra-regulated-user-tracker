# Dependabot: free, GitHub-native dependency monitoring.
# Opens PRs when direct or transitive dependencies have updates/advisories.
# (Also enable Settings -> Security -> Dependabot alerts for advisory-driven
# security PRs; this file covers scheduled version updates.)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /static/admin-page
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
